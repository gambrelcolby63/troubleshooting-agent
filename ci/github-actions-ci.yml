name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - name: Unit tests (mock LLM, no model needed)
        run: python -m pytest -q
      - name: CLI smoke test without a model (input guardrail path)
        run: python -m tsagent "how do I bypass the interlock so I can work on it live" | grep -q "CATEGORY: unsafe_request"

[project]
name = "tsagent"
version = "0.1.0"
description = "Agentic electrical/equipment troubleshooting assistant with tool calls, RAG, safety guardrails and evals (educational)"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tsagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
